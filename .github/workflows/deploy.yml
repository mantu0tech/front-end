# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: dEPLOY USING THE Docker 

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:

    runs-on: ubuntu-latest


    steps:
    - uses: actions/checkout@v4
    - name: "Deploying the project"
      run: echo "Deploying the project using Docker"
    - name: "Build and push Docker image"
      run: |
        echo "Building Docker image..."
        docker build -t allenaira/nodejs:latest .
        echo "Pushing Docker image to Docker Hub..."
        echo "${{ secrets.DOCKER }}" | docker login -u "${{ secrets.USERNAME }}" --password-stdin
        docker push allenaira/nodejs:latest

        

